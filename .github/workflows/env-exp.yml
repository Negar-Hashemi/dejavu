name: Test on Multiple OS

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18, 20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # If you keep .nvmrc, comment out node-version OR remove this line:
          # node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Configure npm for CI
        run: |
          npm config set fund false
          npm config set audit false
          npm config set progress false
          npm config set prefer-offline true

      # Create a lockfile if repo doesn't have one (first run / legacy repos)
      - name: Ensure package-lock.json exists
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            echo "No package-lock.json found. Generating one..."
            npm install --package-lock-only --legacy-peer-deps
          fi

      # Use ci when we have a lockfile; fallback only if something odd happens
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Debug ESLint resolution
        run: |
          npx eslint -v || true
          npm ls --depth=1 eslint eslint-config-airbnb eslint-plugin-import eslint-plugin-react eslint-plugin-jsx-a11y || true

      - name: Run tests
        run: npm test
